# KV-Dumper — automatic deployment to Cloudflare Workers
#
# Runs on every push to main. Requires the following repository secrets:
#   CLOUDFLARE_API_TOKEN  — an API token with "Workers Scripts: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID
#
# Set both under: Settings → Secrets and variables → Actions
#
# When the secrets are not configured yet, the run completes successfully
# with a notice instead of failing — configure them to activate deployment.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured. Add them under Settings → Secrets and variables → Actions to enable automatic deployment."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy with Wrangler
        if: steps.check.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
